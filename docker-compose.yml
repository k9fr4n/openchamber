# Deployment OpenChamber pour Raspberry Pi (arm64).
# Frontal HTTPS : Traefik (/home/kfr/docker/traefic, reseau externe "proxy").
# Acces : https://openchamber.ecritel.net (Traefik:443) + LAN http://<pi>:3000.

services:
  openchamber:
    image: ${OPENCHAMBER_IMAGE:-ghcr.io/k9fr4n/openchamber:latest}
    container_name: openchamber
    ports:
      - "${OPENCHAMBER_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - default
      - proxy
      - browser
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.openchamber.rule=Host(`openchamber.ecritel.net`)"
      - "traefik.http.routers.openchamber.entrypoints=websecure"
      - "traefik.http.routers.openchamber.tls=true"
      - "traefik.http.services.openchamber.loadbalancer.server.port=3000"
      # UI 3D codebase-memory-mcp, servie par ce même conteneur via le
      # forwarder embarqué dans l'image (0.0.0.0:9748 -> 127.0.0.1:9749).
      # Liaisons routeur->service explicites : obligatoires dès qu'un
      # conteneur expose deux services, sinon Traefik refuse les deux
      # routeurs ("cannot be linked automatically with multiple Services").
      - "traefik.http.routers.openchamber.service=openchamber"
      - "traefik.http.routers.cbm-ui.rule=Host(`cbm-ui.ecritel.net`)"
      - "traefik.http.routers.cbm-ui.entrypoints=websecure"
      - "traefik.http.routers.cbm-ui.tls=true"
      - "traefik.http.routers.cbm-ui.service=cbm-ui"
      # Pas de middleware ici : le forwarder embarqué (port 9748) réécrit
      # déjà Host et supprime Origin, exigences de l'UI.
      - "traefik.http.services.cbm-ui.loadbalancer.server.port=9748"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-985}"
    volumes:
      - ./data/openchamber:/home/openchamber/.config/openchamber
      - ./data/opencode/share:/home/openchamber/.local/share/opencode
      - ./data/opencode/state:/home/openchamber/.local/state/opencode
      - ./data/opencode/config:/home/openchamber/.config/opencode
      - ./data/ssh:/home/openchamber/.ssh
      # Index codebase-memory-mcp : config + une .db par projet indexé.
      # Sans ce volume, chaque recréation du conteneur efface tous les index
      # (constaté le 2026-10-16 : conteneur recréé à 06:11, un seul projet
      # réindexé ensuite). Ne JAMAIS persister /tmp/cbm-daemon-* en revanche :
      # les sockets/locks de coordination doivent rester éphémères, sinon un
      # daemon mort bloque tout redémarrage (même panne).
      - ./data/cbm-cache:/home/openchamber/.cache/codebase-memory-mcp
      - ${WORKSPACES_DIR:-./workspaces}:/home/openchamber/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Definir OPENCHAMBER_UI_PASSWORD dans .env}
      GH_TOKEN: ${GH_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_HOST: ${GITLAB_HOST:-gitlab.ecritel.net}
      GITLAB_API_HOST: ${GITLAB_API_HOST:-gitlab.ecritel.net}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # Navigation Web autonome : Chromium headless + serveur Playwright MCP dans
  # un conteneur dédié. OpenCode (dans `openchamber`) s'y connecte en MCP
  # distant via le réseau privé `browser` :
  #   { "mcp": { "playwright": { "type": "remote",
  #     "url": "http://playwright-mcp:8931/mcp" } } }
  # Voir docs/playwright-mcp.md (installation, session authentifiée,
  # politique lecture seule, dépannage).
  #
  # Sécurité :
  # - aucun port publié, aucune route Traefik : le serveur MCP n'est
  #   joignable que depuis le réseau `browser` (pas d'exposition publique) ;
  # - le trafic sortant (Internet / si.ecritel.net) reste autorisé : ne PAS
  #   passer le réseau `browser` en `internal: true`, sinon Chromium ne
  #   pourrait plus joindre aucun site ;
  # - le profil Chromium (cookies, sessions) est persisté dans
  #   ./data/playwright-profile (jamais commité, voir .gitignore).
  playwright-mcp:
    image: ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:v0.0.83}
    container_name: playwright-mcp
    # L'ENTRYPOINT de l'image ajoute déjà :
    #   --headless --browser chromium --no-sandbox
    # On ajoute le transport HTTP (écouté uniquement sur le réseau `browser`)
    # et les chemins persistés.
    #
    # --allowed-hosts : le serveur refuse par défaut tout Host autre que
    # celui du bind (403 "Access is only allowed at localhost:8931").
    # OpenCode s'y connecte via le nom DNS Docker `playwright-mcp`, donc
    # l'en-tête Host vaut `playwright-mcp:<port>` : il doit être allowlisté
    # explicitement (comparaison sur host:port, en minuscules). Pas de `*` :
    # on reste strict, le réseau `browser` isolant déjà le serveur.
    command:
      - --port
      - "${PLAYWRIGHT_MCP_PORT:-8931}"
      - --host
      - "0.0.0.0"
      - --allowed-hosts
      - "playwright-mcp:${PLAYWRIGHT_MCP_PORT:-8931},localhost:${PLAYWRIGHT_MCP_PORT:-8931},127.0.0.1:${PLAYWRIGHT_MCP_PORT:-8931}"
      - --user-data-dir
      - /home/node/playwright-profile
      - --output-dir
      - /home/node/playwright-output
      - --timeout-action
      - "10000"
      - --timeout-navigation
      - "60000"
    environment:
      PLAYWRIGHT_MCP_PORT: "${PLAYWRIGHT_MCP_PORT:-8931}"
    networks:
      - browser
    volumes:
      - ./data/playwright-profile:/home/node/playwright-profile
      - ./data/playwright-output:/home/node/playwright-output
    # Chromium a besoin d'un /dev/shm suffisant pour ne pas crasher
    # (recommandation Playwright officielle). Réduire sur un Pi peu doté
    # en RAM si le système swap (voir docs/playwright-mcp.md).
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const net=require('net');const p=parseInt(process.env.PLAYWRIGHT_MCP_PORT||'8931',10);const s=net.connect(p,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>{process.exit(1)},2000)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  proxy:
    name: proxy
    external: true
  # Réseau privé OpenChamber <-> navigateur. Pas de ports publiés ni de
  # labels Traefik : aucune entrée depuis l'extérieur.
  browser:
    name: openchamber-browser
