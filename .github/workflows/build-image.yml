name: Build image arm64

# Construit l'image Docker arm64 d'OpenChamber depuis les sources upstream
# et la publie sur GHCR (ghcr.io/k9fr4n/openchamber).
#
# Le Raspberry Pi ne construit rien : il télécharge l'image publiée ici.

on:
  # Rebuild automatique quand ce workflow change (utile quand on met à jour
  # UPSTREAM_REF_DEFAULT ci-dessous : le push déclenche la nouvelle build).
  push:
    branches: [main]
    paths:
      - .github/workflows/build-image.yml
      - image/**

  # Rebuild manuel depuis l'onglet Actions, avec choix de la version upstream.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref upstream openchamber/openchamber (tag, branche ou SHA)"
        required: true
        default: "v2.0.2"

env:
  UPSTREAM_REPOSITORY: openchamber/openchamber
  # Version upstream épinglée pour les rebuilds automatiques.
  # Pour mettre à jour : changer cette valeur puis pousser sur main,
  # ou lancer le workflow manuellement avec un autre `ref`.
  UPSTREAM_REF_DEFAULT: v2.0.2
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runner arm64 natif : l'image est construite pour tourner sur le Pi,
    # sans émulation QEMU.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Récupérer les sources upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ inputs.ref || env.UPSTREAM_REF_DEFAULT }}
          fetch-depth: 1
          path: upstream

      - name: Récupérer la surcouche (ce repo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: deploy

      - name: Calculer les tags
        id: tags
        run: |
          REF="${{ inputs.ref || env.UPSTREAM_REF_DEFAULT }}"
          SAFE_REF=$(printf '%s' "$REF" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          SHORT_SHA=$(git -C upstream rev-parse --short=12 HEAD)
          {
            echo "ref=$REF"
            echo "ref_tag=$SAFE_REF"
            echo "sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Build de $REF (commit $SHORT_SHA)"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image de base (upstream)
        uses: docker/build-push-action@v7
        with:
          context: upstream
          platforms: linux/arm64
          # Chargée dans le daemon Docker pour que l'étape suivante en dérive
          # (le builder docker-container ne voit pas les images locales).
          load: true
          tags: openchamber-base:build
          cache-from: type=gha,scope=upstream
          cache-to: type=gha,mode=max,scope=upstream

      - name: Construire et publier l'image finale (gh + glab)
        env:
          IMAGE: ${{ env.IMAGE }}
          REF_TAG: ${{ steps.tags.outputs.ref_tag }}
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          docker build \
            --build-arg BASE_IMAGE=openchamber-base:build \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$REF_TAG" \
            --tag "$IMAGE:sha-$SHA" \
            deploy/image/
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$REF_TAG"
          docker push "$IMAGE:sha-$SHA"